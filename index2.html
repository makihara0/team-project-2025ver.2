<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kato の自己紹介</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#fff;
      --carp-red:#c8102e;
      --soft-red:#ff6b75;
      --muted:#6b6b73;
      --radius:18px;
      --shadow: 0 12px 30px rgba(200,16,46,0.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",Meiryo;
      background:linear-gradient(180deg,#fff 0%,#fff6f7 100%);
      color:#222;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }
    .wrap{width:100%;max-width:760px}
    header{
      background:linear-gradient(90deg,var(--carp-red),var(--soft-red));
      color:#fff;
      padding:14px 18px;
      border-radius:14px;
      box-shadow:0 8px 24px rgba(200,16,46,0.12);
      margin-bottom:20px;
      text-align:center;
    }
    header .title{margin:0;font-weight:700;font-size:1.1rem}
    .card{
      background:#fff;
      border-radius:var(--radius);
      padding:28px;
      box-shadow:var(--shadow);
      text-align:center;
    }
    .avatar{
      width:96px;height:96px;margin:0 auto 12px;font-size:46px;display:flex;align-items:center;justify-content:center;
      border-radius:50%;background:linear-gradient(135deg,#fff,#ffecec);box-shadow:0 8px 20px rgba(0,0,0,0.06)
    }
    .name{font-size:1.3rem;margin:6px 0 4px;font-weight:700;color:var(--carp-red)}
    .bio{margin:0 0 12px;color:var(--muted)}
    .team{color:var(--carp-red);font-weight:700}
    .info{list-style:none;padding:0;margin:10px 0 18px;color:var(--muted)}
    .info li{padding:6px 0;border-top:1px dashed #f6e5e6}
    .btn{
      display:inline-block;background:var(--carp-red);color:#fff;padding:8px 16px;border-radius:999px;text-decoration:none;font-weight:700;
      box-shadow:0 10px 22px rgba(200,16,46,0.12);
    }
    footer{margin-top:18px;text-align:center;color:var(--muted);font-size:0.9rem}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">こんにちは！ニックネーム：kato</div>
    </header>

    <main class="card" role="main">
      <div class="avatar" aria-hidden="true">🐣</div>
      <h1 class="name">kato</h1>
      <p class="bio">かわいらしい雰囲気で、のんびり楽しく制作しています。</p>

      <p class="bio">好きな球団は <span class="team">広島カープ</span> ⚾️</p>

      <ul class="info" aria-label="私について">
        <li>趣味：イラスト、読書、散歩</li>
        <li>得意：フロントエンド、デザイン調整</li>
      </ul>

      <p><a class="btn" href="mailto:example@example.com">Contact</a></p>
    </main>

    <footer>
      &copy; 2025 kato
    </footer>
  </div>
</body>
</html>
