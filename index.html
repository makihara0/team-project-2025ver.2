<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ログイン</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="login-title">
      <h1 id="login-title" class="title">サインイン</h1>

      <form id="loginForm" class="form" novalidate>
        <label class="field">
          <span class="label-text">メールアドレス</span>
          <input id="email" name="email" type="email" autocomplete="email" required
                 placeholder="you@example.com" aria-describedby="emailHelp" />
          <small id="emailHelp" class="hint">会社のメールか個人のメールを入力してください</small>
        </label>

        <label class="field">
          <span class="label-text">パスワード</span>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required
                   placeholder="パスワードを入力" aria-describedby="pwdHelp" minlength="8" />
            <button type="button" id="togglePwd" class="toggle-btn" aria-pressed="false" aria-label="パスワード表示切替">表示</button>
          </div>
          <small id="pwdHelp" class="hint">8文字以上のパスワードを推奨</small>
        </label>

        <div class="actions">
          <button class="btn secondary" type="button" id="guestBtn" aria-label="ゲストで続行">ゲストで続行</button>
          <button class="btn primary" type="submit">ログイン</button>
        </div>

        <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>
      </form>

      <details class="about" aria-label="デザインについて">
        <summary>自分のデザインについて</summary>
        <p>
          シンプルでアクセシブルな設計を意識しました。ラベルとヒントを明確にし、キーボード操作やスクリーンリーダーに対応しています。
          カード中央寄せ、可読性の高い配色、モバイルでの入力しやすさを優先しています。
        </p>
      </details>
    </section>
  </main>

      <script>
    (function () {
      const form = document.getElementById('loginForm');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const msg = document.getElementById('formMessage');
      const toggle = document.getElementById('togglePwd');
      const guestBtn = document.getElementById('guestBtn');
      const GUEST_PAGE = '2-21-自己紹介ページ.html';

      toggle.addEventListener('click', () => {
        const isPwd = password.type === 'password';
        password.type = isPwd ? 'text' : 'password';
        toggle.textContent = isPwd ? '非表示' : '表示';
        toggle.setAttribute('aria-pressed', String(!isPwd));
      });

      // 明示的なゲストボタン
      guestBtn.addEventListener('click', () => {
        window.location.href = GUEST_PAGE;
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        msg.textContent = '';
        const emailVal = email.value.trim();
        const pwdVal = password.value.trim();

        // 両方空ならゲストモードで遷移
        if (emailVal === '' && pwdVal === '') {
          window.location.href = GUEST_PAGE;
          return;
        }

        // 入力がある場合は通常のバリデーション
        if (!email.checkValidity()) {
          msg.textContent = 'メールアドレスの形式が正しくありません。';
          email.focus();
          return;
        }
        if (!password.checkValidity()) {
          msg.textContent = 'パスワードは8文字以上で入力してください。';
          password.focus();
          return;
        }

        // TODO: 実際の送信処理（Fetchなど）をここに追加
        msg.textContent = '送信処理を実行します（ダミー）';
      });
    })();
  </script>
</body>
</html>
